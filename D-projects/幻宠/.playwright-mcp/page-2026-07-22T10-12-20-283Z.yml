              - generic [ref=f5e168]: 在这个充满各种神秘生物的世界里，你将扮演一位动物驯兽师，探索未知的荒野，捕捉神奇的生物，并陪伴它们成长进化。建造你的房车之家，遨游荒野，对抗偷猎团伙和邪教徒，并在动物竞技场中争夺最高排名。一路上，你将与更多稀有生物相遇，揭开这些生物的起源、进化以及这个世界的秘密。捕捉并收集神奇的生物：荒野中充满了可爱、强大且稀有的生物。捕捉它们，将它们变成你的宠物！陪伴小动物成长：在旅途中，看着这些神奇的小动物逐渐成长进化。见证并催化它们进化的过程，让它们变得更强大！轻松有趣的战斗：你培育的小动物们可以帮助你对抗凶猛的野兽、偷猎者，或与其他玩家进行友谊赛！参与竞技比赛：想成为声名显赫的小动物驯兽师，就加入小动物竞技场，角逐冠军吧！激动人心的探索之旅：驾驶房车探索广阔的世界，成为环游世界的驯兽师和冒险家！结成联盟：与其他玩家组队，共同探索荒野，揭开真相，获得改变世界的力量。在“小动物竞技场”开启冒险之旅，创造你的传奇，改变未来。立即下载游戏，开启你的奇幻之旅！
